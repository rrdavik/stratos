<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fbfaf7"/><text x="30" y="40" font-size="24" text-anchor="start" font-weight="bold" fill="#1b1b1f">Estratos · CV del modular → OSC por USB</text><text x="30" y="66" font-size="14" text-anchor="start" font-weight="normal" fill="#55555c">Doepfer A-180-9 (multicore pasivo, sockets 1-8) + red de entrada por canal + ESP32-S3 (o ESP32 / Arduino Nano) + puente_osc.py</text><rect x="20" y="110" width="150" height="86" fill="#ffffff" stroke="#1b1b1f" stroke-width="2" rx="10"/><text x="32" y="136" font-size="16" text-anchor="start" font-weight="bold" fill="#1b1b1f">Modular</text><text x="32" y="160" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">LFO, ruido,</text><text x="32" y="178" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">espacio, saturacion</text><rect x="190" y="110" width="150" height="86" fill="#ffffff" stroke="#1b1b1f" stroke-width="2" rx="10"/><text x="202" y="136" font-size="16" text-anchor="start" font-weight="bold" fill="#1b1b1f">A-180-9</text><text x="202" y="160" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">sockets 1-8</text><text x="202" y="178" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">en la caja</text><rect x="400" y="110" width="150" height="86" fill="#ffffff" stroke="#1b1b1f" stroke-width="2" rx="10"/><text x="412" y="136" font-size="16" text-anchor="start" font-weight="bold" fill="#1b1b1f">Jack RJ45</text><text x="412" y="160" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">apantallado</text><text x="412" y="178" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">malla = GND</text><rect x="570" y="110" width="150" height="86" fill="#ffffff" stroke="#1b1b1f" stroke-width="2" rx="10"/><text x="582" y="136" font-size="16" text-anchor="start" font-weight="bold" fill="#1b1b1f">8 x red</text><text x="582" y="160" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">de entrada</text><text x="582" y="178" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">(abajo)</text><rect x="740" y="110" width="150" height="86" fill="#ffffff" stroke="#1b1b1f" stroke-width="2" rx="10"/><text x="752" y="136" font-size="16" text-anchor="start" font-weight="bold" fill="#1b1b1f">ESP32-S3</text><text x="752" y="160" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">GPIO 1-8 (ADC1)</text><text x="752" y="178" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">cv_osc.ino</text><rect x="950" y="110" width="210" height="86" fill="#ffffff" stroke="#1b1b1f" stroke-width="2" rx="10"/><text x="962" y="136" font-size="16" text-anchor="start" font-weight="bold" fill="#1b1b1f">Ordenador</text><text x="962" y="160" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">puente_osc.py</text><text x="962" y="178" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">UDP :9000 -&gt; TD</text><line x1="170" y1="153" x2="190" y2="153" stroke="#1b1b1f" stroke-width="2"/><line x1="190" y1="153" x2="179.195" y2="147.78" stroke="#1b1b1f" stroke-width="2"/><line x1="190" y1="153" x2="179.195" y2="158.22" stroke="#1b1b1f" stroke-width="2"/><line x1="340" y1="153" x2="400" y2="153" stroke="#1b1b1f" stroke-width="2"/><line x1="400" y1="153" x2="389.195" y2="147.78" stroke="#1b1b1f" stroke-width="2"/><line x1="400" y1="153" x2="389.195" y2="158.22" stroke="#1b1b1f" stroke-width="2"/><text x="370" y="174" font-size="11" text-anchor="middle" font-weight="normal" fill="#3a3a40">CAT-6a/7</text><line x1="550" y1="153" x2="570" y2="153" stroke="#1b1b1f" stroke-width="2"/><line x1="570" y1="153" x2="559.195" y2="147.78" stroke="#1b1b1f" stroke-width="2"/><line x1="570" y1="153" x2="559.195" y2="158.22" stroke="#1b1b1f" stroke-width="2"/><line x1="720" y1="153" x2="740" y2="153" stroke="#1b1b1f" stroke-width="2"/><line x1="740" y1="153" x2="729.195" y2="147.78" stroke="#1b1b1f" stroke-width="2"/><line x1="740" y1="153" x2="729.195" y2="158.22" stroke="#1b1b1f" stroke-width="2"/><line x1="890" y1="153" x2="950" y2="153" stroke="#1b1b1f" stroke-width="2"/><line x1="950" y1="153" x2="939.195" y2="147.78" stroke="#1b1b1f" stroke-width="2"/><line x1="950" y1="153" x2="939.195" y2="158.22" stroke="#1b1b1f" stroke-width="2"/><text x="920" y="174" font-size="11" text-anchor="middle" font-weight="normal" fill="#3a3a40">USB</text><text x="400" y="222" font-size="13" text-anchor="middle" font-weight="bold" fill="#b42318">Nunca a un switch, router ni al puerto de red: por el cable van voltios, no Ethernet.</text><text x="30" y="272" font-size="18" text-anchor="start" font-weight="bold" fill="#1b1b1f">Un canal (x8): ±10 V → 0,24-2,40 V en el ADC</text><text x="30" y="425" font-size="14" text-anchor="start" font-weight="bold" fill="#1b1b1f">RJ45 pin n</text><text x="30" y="443" font-size="12" text-anchor="start" font-weight="normal" fill="#55555c">(socket n del A-180-9)</text><line x1="130" y1="420" x2="170" y2="420" stroke="#1b1b1f" stroke-width="2"/><line x1="170" y1="420" x2="190" y2="420" stroke="#1b1b1f" stroke-width="2"/><rect x="190" y="411" width="40" height="18" fill="white" stroke="#1b1b1f" stroke-width="2" rx="0"/><line x1="230" y1="420" x2="250" y2="420" stroke="#1b1b1f" stroke-width="2"/><text x="210" y="404" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b1b1f">R1  100k</text><line x1="250" y1="420" x2="580" y2="420" stroke="#1b1b1f" stroke-width="2"/><circle cx="330" cy="420" r="4" fill="#1b1b1f"/><line x1="330" y1="420" x2="330" y2="390" stroke="#1b1b1f" stroke-width="2"/><line x1="330" y1="310" x2="330" y2="330" stroke="#1b1b1f" stroke-width="2"/><rect x="321" y="330" width="18" height="40" fill="white" stroke="#1b1b1f" stroke-width="2" rx="0"/><line x1="330" y1="370" x2="330" y2="390" stroke="#1b1b1f" stroke-width="2"/><text x="314" y="355" font-size="13" text-anchor="end" font-weight="normal" fill="#1b1b1f">R2  27k (Nano 47k)</text><line x1="330" y1="310" x2="330" y2="298" stroke="#1b1b1f" stroke-width="2"/><line x1="318" y1="298" x2="342" y2="298" stroke="#1b1b1f" stroke-width="2"/><text x="330" y="292" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b1b1f">3V3 (Nano 5V)</text><line x1="330" y1="420" x2="330" y2="440" stroke="#1b1b1f" stroke-width="2"/><rect x="321" y="440" width="18" height="40" fill="white" stroke="#1b1b1f" stroke-width="2" rx="0"/><line x1="330" y1="480" x2="330" y2="500" stroke="#1b1b1f" stroke-width="2"/><text x="314" y="465" font-size="13" text-anchor="end" font-weight="normal" fill="#1b1b1f">R3  22k (Nano 82k)</text><line x1="330" y1="500" x2="330" y2="510" stroke="#1b1b1f" stroke-width="2"/><line x1="319" y1="510" x2="341" y2="510" stroke="#1b1b1f" stroke-width="2"/><line x1="323" y1="515" x2="337" y2="515" stroke="#1b1b1f" stroke-width="2"/><line x1="327" y1="520" x2="333" y2="520" stroke="#1b1b1f" stroke-width="2"/><circle cx="450" cy="420" r="4" fill="#1b1b1f"/><line x1="450" y1="420" x2="450" y2="452" stroke="#1b1b1f" stroke-width="2"/><line x1="434" y1="452" x2="466" y2="452" stroke="#1b1b1f" stroke-width="2"/><line x1="434" y1="460" x2="466" y2="460" stroke="#1b1b1f" stroke-width="2"/><line x1="450" y1="460" x2="450" y2="500" stroke="#1b1b1f" stroke-width="2"/><text x="472" y="462" font-size="13" text-anchor="start" font-weight="normal" fill="#1b1b1f">C1 100n</text><line x1="450" y1="500" x2="450" y2="510" stroke="#1b1b1f" stroke-width="2"/><line x1="439" y1="510" x2="461" y2="510" stroke="#1b1b1f" stroke-width="2"/><line x1="443" y1="515" x2="457" y2="515" stroke="#1b1b1f" stroke-width="2"/><line x1="447" y1="520" x2="453" y2="520" stroke="#1b1b1f" stroke-width="2"/><circle cx="550" cy="420" r="4" fill="#1b1b1f"/><line x1="550" y1="340" x2="550" y2="370" stroke="#1b1b1f" stroke-width="2"/><polygon points="540,388 560,388 550,372" fill="white" stroke="#1b1b1f" stroke-width="2"/><line x1="540" y1="370" x2="560" y2="370" stroke="#1b1b1f" stroke-width="2"/><line x1="550" y1="388" x2="550" y2="420" stroke="#1b1b1f" stroke-width="2"/><line x1="550" y1="340" x2="550" y2="328" stroke="#1b1b1f" stroke-width="2"/><line x1="538" y1="328" x2="562" y2="328" stroke="#1b1b1f" stroke-width="2"/><text x="550" y="322" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b1b1f">3V3 (Nano 5V)</text><line x1="550" y1="420" x2="550" y2="450" stroke="#1b1b1f" stroke-width="2"/><polygon points="540,468 560,468 550,452" fill="white" stroke="#1b1b1f" stroke-width="2"/><line x1="540" y1="450" x2="560" y2="450" stroke="#1b1b1f" stroke-width="2"/><line x1="550" y1="468" x2="550" y2="500" stroke="#1b1b1f" stroke-width="2"/><line x1="550" y1="500" x2="550" y2="510" stroke="#1b1b1f" stroke-width="2"/><line x1="539" y1="510" x2="561" y2="510" stroke="#1b1b1f" stroke-width="2"/><line x1="543" y1="515" x2="557" y2="515" stroke="#1b1b1f" stroke-width="2"/><line x1="547" y1="520" x2="553" y2="520" stroke="#1b1b1f" stroke-width="2"/><text x="568" y="380" font-size="13" text-anchor="start" font-weight="normal" fill="#1b1b1f">D1</text><text x="568" y="465" font-size="13" text-anchor="start" font-weight="normal" fill="#1b1b1f">D2</text><text x="568" y="482" font-size="12" text-anchor="start" font-weight="normal" fill="#55555c">BAT54S</text><line x1="580" y1="420" x2="660" y2="420" stroke="#1b1b1f" stroke-width="2"/><rect x="660" y="398" width="150" height="44" fill="#ffffff" stroke="#1b1b1f" stroke-width="2" rx="6"/><text x="735" y="425" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b1b1f">GPIO n (ADC)</text><text x="30" y="560" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">V_nodo = MEDIO + PENDIENTE x V_entrada   (el firmware lo deshace; "cero" y "cinco" lo calibran)</text><text x="30" y="582" font-size="13" text-anchor="start" font-weight="normal" fill="#3a3a40">Impedancia de entrada ~100 kΩ (como una entrada Eurorack); ±12 V caben sin llegar a los diodos en ESP32.</text><text x="30" y="640" font-size="18" text-anchor="start" font-weight="bold" fill="#1b1b1f">Valores por placa</text><rect x="25" y="652" width="1150" height="28" fill="#ecebe6" stroke="#ecebe6" stroke-width="0" rx="0"/><text x="30" y="672" font-size="14" text-anchor="start" font-weight="bold" fill="#1b1b1f"></text><text x="330" y="672" font-size="14" text-anchor="start" font-weight="bold" fill="#1b1b1f">ESP32-S3 / ESP32 (3,3 V)</text><text x="760" y="672" font-size="14" text-anchor="start" font-weight="bold" fill="#1b1b1f">Arduino Nano (5 V)</text><line x1="25" y1="680" x2="1175" y2="680" stroke="#d4d2cb" stroke-width="1"/><text x="30" y="700" font-size="14" text-anchor="start" font-weight="bold" fill="#1b1b1f">R1 · R2 · R3</text><text x="330" y="700" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">100k · 27k · 22k (1 %)</text><text x="760" y="700" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">100k · 47k · 82k (1 %)</text><line x1="25" y1="708" x2="1175" y2="708" stroke="#d4d2cb" stroke-width="1"/><text x="30" y="728" font-size="14" text-anchor="start" font-weight="bold" fill="#1b1b1f">-10 V · 0 V · +10 V en el ADC</text><text x="330" y="728" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">0,24 · 1,32 · 2,40 V</text><text x="760" y="728" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">0,15 · 2,45 · 4,75 V</text><line x1="25" y1="736" x2="1175" y2="736" stroke="#d4d2cb" stroke-width="1"/><text x="30" y="756" font-size="14" text-anchor="start" font-weight="bold" fill="#1b1b1f">Resolucion</text><text x="330" y="756" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">~7 mV de CV (12 bits)</text><text x="760" y="756" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">~21 mV de CV (10 bits)</text><line x1="25" y1="764" x2="1175" y2="764" stroke="#d4d2cb" stroke-width="1"/><text x="30" y="784" font-size="14" text-anchor="start" font-weight="bold" fill="#1b1b1f">Pines de los canales 1-8</text><text x="330" y="784" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">S3: GPIO 1-8 · ESP32: 36 39 34 35 32 33 25 26</text><text x="760" y="784" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">A0-A7</text><line x1="25" y1="792" x2="1175" y2="792" stroke="#d4d2cb" stroke-width="1"/><text x="30" y="812" font-size="14" text-anchor="start" font-weight="bold" fill="#1b1b1f">Paquetes por segundo</text><text x="330" y="812" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">100</text><text x="760" y="812" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">50</text><line x1="25" y1="820" x2="1175" y2="820" stroke="#d4d2cb" stroke-width="1"/><text x="30" y="860" font-size="18" text-anchor="start" font-weight="bold" fill="#1b1b1f">RJ45 (lado del jack)</text><text x="30" y="886" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">pin 1-8 = sockets 1-8 del A-180-9 = canales 1-8: 1 lfo · 2 ruido · 3 espacio · 4 saturacion · 5-8 libres</text><text x="30" y="908" font-size="14" text-anchor="start" font-weight="normal" fill="#1b1b1f">Malla del cable / carcasa del jack = GND de la placa (la masa comun del modular llega por la malla).</text><text x="30" y="930" font-size="14" text-anchor="start" font-weight="normal" fill="#b42318">Comprueba con un polimetro (continuidad) que el pin n llega al socket n: no he podido abrir la hoja de Doepfer.</text></svg>